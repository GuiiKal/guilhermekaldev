<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página não encontrada — Portfólio de Guilherme Kal">
  <title>404 — Página não encontrada</title>
  <link rel="icon" href="img/favicon-gk.jpeg" type="image/jpeg">

  <script>
    (function () {
      const theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.classList.remove('dark', 'light');
      document.documentElement.classList.add(theme);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&family=DM+Sans:opsz,wght@9..40,300;400;500&display=swap"
    rel="stylesheet">

  <style>
    /* ─── Custom Properties ─── */
    :root {
      --bg-primary:   #fafafa;
      --bg-secondary: #f0f0f0;
      --text-primary: #0f0c29;
      --text-muted:   rgba(15, 12, 41, 0.5);
      --accent:       #7c3aed;
      --accent-2:     #3b82f6;
      --border:       rgba(124, 58, 237, 0.25);
    }

    html.dark {
      --bg-primary:   #0f0c29;
      --bg-secondary: #0a0818;
      --text-primary: #ffffff;
      --text-muted:   rgba(255, 255, 255, 0.45);
      --accent:       #7c3aed;
      --accent-2:     #3b82f6;
      --border:       rgba(124, 58, 237, 0.2);
    }

    /* ─── Reset ─── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h1, h2, h3, .font-display {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
    }

    /* ─── Background Blobs ─── */
    .background-blobs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
      animation: drift 8s ease-in-out infinite;
    }

    .blob-purple {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.3), transparent 70%);
      top: -100px;
      right: -50px;
      animation-delay: 0s;
    }

    .blob-blue {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.2), transparent 70%);
      bottom: -150px;
      left: -100px;
      animation-delay: 2s;
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, 30px); }
    }

    /* ─── Container ─── */
    .container {
      position: relative;
      z-index: 10;
      max-width: 600px;
      width: 100%;
      padding: 24px;
      text-align: center;
    }

    /* ─── 404 Number ─── */
    .error-code {
      font-size: clamp(5rem, 20vw, 12rem);
      font-weight: 800;
      line-height: 1;
      margin-bottom: 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: bounce 3s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    /* ─── Heading ─── */
    h1 {
      font-size: clamp(1.5rem, 6vw, 2.5rem);
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    /* ─── Subheading ─── */
    .subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 32px;
      line-height: 1.8;
    }

    /* ─── Accent Line ─── */
    .accent-line {
      width: 50px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      margin: 0 auto 32px;
      border-radius: 2px;
    }


    /* ─── Responsive ─── */
    @media (max-width: 600px) {
      .error-code {
        margin-bottom: 20px;
      }

      h1 {
        margin-bottom: 8px;
      }

      .buttons {
        flex-direction: column;
      }

      .blob {
        filter: blur(60px);
      }
    }
  </style>
</head>

<body>
  <!-- Background Blobs -->
  <div class="background-blobs">
    <div class="blob blob-purple"></div>
    <div class="blob blob-blue"></div>
  </div>

  <!-- Main Container -->
  <div class="container">
    <div class="error-code">404</div>

    <h1>Página não encontrada</h1>

    <div class="accent-line"></div>

    <p class="subtitle">
      Parece que você se perdeu no universo digital. A página que procura não existe mais ou foi movida.
    </p>
  </div>
</body>
</html>
